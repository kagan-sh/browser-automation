<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Browser</title>
    <link id="kagan-theme" rel="stylesheet" href="/__kagan/theme.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <strong>Browser</strong>
        <span id="state" class="muted">No session</span>
      </div>
      <div class="actions">
        <button id="open" type="button">Open</button>
        <button id="refresh" type="button" title="Refresh the session list">Refresh</button>
        <button id="stop" type="button">Stop</button>
        <button id="close" type="button" class="danger">Close</button>
      </div>
    </header>

    <div id="view">
      <img id="frame" alt="Live view of the browser session" hidden />
      <div id="empty">
        <p id="empty-title">No browser session</p>
        <p class="muted" id="empty-hint">
          Open one to watch the page here. The agent drives it with
          <code>browser_run</code> or <code>kg browser-automation run</code>.
        </p>
      </div>
    </div>

    <div id="meta">
      <span id="title" class="url"></span>
      <span id="url" class="muted"></span>
    </div>

    <form id="type-row">
      <input id="text" type="text" placeholder="Type into the page…" autocomplete="off" />
      <button id="send" type="submit">Type</button>
      <button id="enter" type="button" title="Press Enter">⏎</button>
    </form>

    <ul id="sessions"></ul>
    <p id="error" class="error" hidden></p>
    <p class="muted note">Clicks and keystrokes here go to the page. Scripts the agent runs see the same page.</p>

    <script src="panel.js"></script>
  </body>
</html>
